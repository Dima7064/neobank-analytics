name: NeoBank CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy scipy sqlalchemy psycopg2-binary clickhouse-connect pyyaml faker pytest pytest-mock

      - name: Test with pytest
        run: |
          pytest tests/ -v
