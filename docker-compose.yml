
services:
  postgres:
    image: postgres:16-alpine
    container_name: neobank_postgres
    environment:
      POSTGRES_USER: analyst
      POSTGRES_PASSWORD: analyst_pass
      POSTGRES_DB: neobank
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U analyst -d neobank"]
      interval: 10s
      timeout: 5s
      retries: 5

  clickhouse:
    image: clickhouse/clickhouse-server:24.1-alpine
    container_name: neobank_clickhouse
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    environment:
      CLICKHOUSE_DB: neobank
      CLICKHOUSE_USER: analyst
      CLICKHOUSE_PASSWORD: analyst_pass
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1

volumes:
  postgres_data:
  clickhouse_data: